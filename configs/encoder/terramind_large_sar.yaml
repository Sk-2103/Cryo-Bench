# TerraMind large, SAR-only, for datasets with no optical modality (e.g. CaFFe). The shared
# terramind_large.yaml declares both optical and SAR modalities, which the Preprocessor
# expects a dataset to provide; use this variant instead for a SAR-only dataset.
_target_: pangaea.encoders.terramind_encoder.terramind_v1_large
encoder_weights: ./pretrained_models/TerraMind_v1_large.pt
download_url: null

input_size: 224
patch_size: 16
merge_method: "mean"
modalities: ["S1GRD"]

input_bands:
  sar:
    - VV
    - VH

output_layers:
  - 7
  - 11
  - 15
  - 23

output_dim: 1024
