name: pangaea-bench
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch>=2.1.0
      - torchvision
      - geopandas
      - rasterio
      - pillow
      - scikit-learn
      - tensorboard
      - tqdm
      - tifffile
      - timm
      - einops
      - opencv-python
      - rioxarray
      - gdown
      - ptflops
      - google-cloud-storage
      - omegaconf
      - pyDataverse
      - pytest
      - yacs
      - wandb
      - hydra-core
