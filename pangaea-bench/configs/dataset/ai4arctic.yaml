# @package _global_

dataset:
  _target_: pangaea.datasets.ai4arctic.AI4ArcticDataset
  dataset_name: ai4arctic
  root_path: /media/turtle-ssd/users/skaushik/Cryo-Data/Benchmark/AI4Arctic
  img_size: 512                   # patch size to crop from large scenes
  multi_temporal: 0
  multi_modal: false
  ignore_index: 255
  num_classes: 6                     
  classes:
    - open_water                     # 0
    - new_ice                        # 1
    - young_ice                      # 2
    - thin_first_year_ice            # 3
    - thick_first_year_ice           # 4
    - old_ice                        # 5
  distribution: [0.65, 0.01, 0.025, 0.021, 0.145, 0.132]                        # 5
  bands:
    sar: [VV, VH]
  data_mean:
    sar: [-0.16381396, -0.22024433]
  data_std:
    sar: [0.61435765, 0.37416646]          
  data_min:
    sar: [-30.0, -35.0]
  data_max:
    sar: [5.0, 0.0]
  
